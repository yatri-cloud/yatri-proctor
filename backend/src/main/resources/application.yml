spring:
  application:
    name: yatri-proctor-backend

  # ── H2 embedded database ─────────────────────────────────
  datasource:
    url: jdbc:h2:mem:proctordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # ── File uploads ─────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ── JWT ──────────────────────────────────────────────────
app:
  jwt:
    secret: yatri-proctor-jwt-secret-key-must-be-at-least-512-bits-long-for-hs512-algorithm-yatricloud
    expiration-ms: 86400000   # 24 hours

# ── CORS ─────────────────────────────────────────────────
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174,http://localhost:3000,https://*.onrender.com,https://render.com"

# ── Actuator ─────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── SpringDoc / Swagger ───────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    try-it-out-enabled: true
    operations-sorter: method
  show-actuator: false

logging:
  level:
    com.yatricloud: DEBUG
    org.springframework.security: WARN
